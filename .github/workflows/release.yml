name: release
concurrency:
  group: "release-${{ inputs.version_tag }}"
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to release (e.g., v2.9.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-gems.yml
    with:
      release: true
      artifact_prefix: "release-${{ inputs.version_tag }}-"
      ref: ${{ inputs.version_tag }}

  push:
    name: "Push gems to RubyGems.org"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: gems
          pattern: "release-${{ inputs.version_tag }}-*-gem"
          merge-multiple: true
      - name: Print checksums
        run: ls gems/*.gem | sort | xargs sha256sum
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push gems
        run: |
          # push single-ABI gems (named after their checksum, e.g. sqlite3-2.9.1-78be552b.gem) last
          single_abi='-[0-9a-f]{8,64}\.gem$'
          for gem in $(ls gems/*.gem | grep -Ev -e "${single_abi}") $(ls gems/*.gem | grep -E -e "${single_abi}"); do
            echo "Pushing ${gem} ..."
            gem push "${gem}" || echo "WARNING: Failed to push ${gem} (may already exist)"
          done
